name: Image

# Builds the production image and runs the container tests (the image, the production stack,
# backup, restore, deploy and rollback). It publishes nothing: publishing comes with MOQ-29.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    env:
      IMAGE: 1moq-bot:ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Check the deploy scripts
        run: shellcheck -x deploy/lib.sh deploy/deploy.sh deploy/backup/backup.sh deploy/backup/restore.sh
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t "$IMAGE" .
      - name: Container tests
        run: pnpm test:container
