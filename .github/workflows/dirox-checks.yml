# Dirox checks: the specs (OpenSpec) and the project knowledge (OKF) must be valid, and no PR
# skips finishing its ticket (OKF retro answered, finished change archived, verified and proven by its
# tests) or a review gate (design for a large change, QC and a code review for any code; on a small
# team, the tester's approval or a self-review with review-pr's pre-review comment).
# Added by /dirox-project:set-up-repo. The OpenSpec version is pinned by the kit.
name: Dirox checks

on:
  pull_request:
    # edited: pr-checks reads the PR description, so it runs again when that changes.
    # ready_for_review: on a draft, pr-checks only warns; marking it ready makes them errors.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # An approval (or its dismissal) runs pr-checks again: the review gates live there. A self-review
  # counts once its "Self-reviewed:" line is in the description: editing the description runs it again.
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  # The PR's comments (review-pr's pre-review, for a self-review) are read through the issues API.
  issues: read

jobs:
  specs-and-knowledge:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: OpenSpec specs and changes
        run: npx -y @fission-ai/openspec@1.14.1 validate --all --strict --no-interactive
      - name: OKF knowledge
        run: node .github/scripts/okf-validate.mjs okf

  pr-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the dropped-spec-lines check reads when each line was added.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: OKF retro answered, finished changes archived and proven, review gates passed
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-check.mjs
